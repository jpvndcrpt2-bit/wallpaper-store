<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دار النقوش · نموذج</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one store, six views (home, shop, try-on, albums, tips, how to buy); sticky header with cart; cart opens as a side drawer. */
:root{
  --bg:#edf0ec; --surface:#fafbf8; --ink:#1b2a29; --muted:#5b6a66; --line:#d3dbd6;
  --accent:#1f5f5a; --accent-ink:#ffffff; --brass:#9c6f22; --soft:#e2e9e5; --shade:rgba(15,25,24,.45);
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#19211f; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2b3734;
  --accent:#5db0a6; --accent-ink:#0c1514; --brass:#d6a54f; --soft:#222d2a; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#19211f; --ink:#e5ebe8; --muted:#9aa8a3; --line:#2b3734;
  --accent:#5db0a6; --accent-ink:#0c1514; --brass:#d6a54f; --soft:#222d2a; --shade:rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.6;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:24px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
@media (max-width:820px){nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto}.top .in{gap:8px}}
nav button{white-space:nowrap;background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
nav button[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:600}
.cartBtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:20px;padding:0 6px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.demo{font-size:11.5px;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:1px 9px;white-space:nowrap}

.view{padding-block:22px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 11px;font-size:13.5px}
.muted{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:24px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.25;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .txt{display:flex;flex-direction:column;gap:14px}
.hero .txt p{color:var(--muted);max-width:52ch;font-size:16px}
.hero canvas{width:100%;height:auto;border-radius:16px;display:block;border:1px solid var(--line)}
.heroSw{display:flex;gap:8px;flex-wrap:wrap}
.heroSw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0;overflow:hidden;cursor:pointer;background:none}
.heroSw button[aria-pressed="true"]{border-color:var(--accent)}
.heroSw canvas{width:100%;height:100%;display:block}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.catCard{position:relative;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;aspect-ratio:4/5;background:var(--soft);text-align:start}
.catCard canvas{position:absolute;inset:0;width:100%;height:100%}
.catCard span{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(10,18,17,.78));color:#fff;font-weight:600;font-size:15px}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.why{grid-template-columns:minmax(0,1fr)}}
.why div{border-top:2px solid var(--accent);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.why b{font-size:16px}
.why p{color:var(--muted);font-size:14px}

/* shop */
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.shop{grid-template-columns:minmax(0,1fr)}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.filters details{border-bottom:1px solid var(--line);padding-block:6px}
.filters details:last-of-type{border-bottom:0}
.filters summary{cursor:pointer;font-weight:600;padding-block:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px;border:1px solid var(--line)}
.shopTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.shopTop input,.shopTop select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.shopTop input{min-width:0;flex:1;max-width:320px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .img{border:0;padding:0;cursor:pointer;background:var(--soft);display:block}
.card canvas{width:100%;aspect-ratio:1;display:block}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:var(--body);font-weight:600;font-size:15px}
.meta{font-size:12.5px;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.card .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* try-on */
.tool{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:900px){.tool{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:18px}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.cbox{border-radius:12px;overflow:hidden;background:var(--soft);touch-action:none;border:1px solid var(--line)}
#view{display:block;width:100%;height:auto;cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-inline-start:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctl input{width:110px;accent-color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:260px;overflow:auto;padding:2px}
.mini button{border:2px solid transparent;border-radius:8px;padding:0;cursor:pointer;background:none;overflow:hidden}
.mini button[aria-pressed="true"]{border-color:var(--accent)}
.mini canvas{width:100%;aspect-ratio:1;display:block}
.cur{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--brass);direction:ltr;unicode-bidi:isolate}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box;color:var(--ink);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.stat small{font-size:12px;color:var(--muted)}
.stat strong{font-size:19px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);max-width:75ch}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.shot img{display:block;width:100%;cursor:zoom-in}
.shot div{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;font-size:12.5px}
.shot button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.line img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.catCard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.strip img,.heroSw img{width:100%;height:100%;object-fit:cover;display:block}
.card .img img,.mini img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;display:block}
.dlg img{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}
/* albums */
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.album{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.strip{display:grid;grid-template-columns:repeat(4,1fr);height:110px}
.strip canvas{width:100%;height:100%;display:block}
.album .b{padding:12px;display:flex;flex-direction:column;gap:6px}
.album h3{font-size:20px}
/* tips */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tip h3{font-size:19px}
.tip ul{margin:0;padding-inline-start:20px;color:var(--ink)}
.tip li{margin-block:2px}
.tag{font-size:12px;color:var(--brass)}
/* how */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
@media (max-width:820px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.steps div::before{counter-increment:s;content:counter(s,arabic-indic);font-family:var(--display);font-size:28px;color:var(--accent);line-height:1}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.forms{grid-template-columns:minmax(0,1fr)}}
.msg{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;margin:0;font-family:var(--body)}

/* dialog + drawer */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;justify-content:center;align-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;max-width:860px;width:100%;max-height:calc(100% - 20px);overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px;position:relative}
@media (max-width:700px){.dlg{grid-template-columns:minmax(0,1fr)}}
.dlg canvas{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.dlg .b{display:flex;flex-direction:column;gap:10px}
.dlg h2{font-size:26px}
.attrs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.attrs dt{color:var(--muted)}
.attrs dd{margin:0}
.x{position:absolute;top:10px;inset-inline-end:10px;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--surface);z-index:50;display:flex;flex-direction:column;border-inline-start:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;box-sizing:border-box}
.drawer h2{font-size:22px}
.lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.line canvas{width:56px;height:56px;border-radius:8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.sum{display:flex;justify-content:space-between;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:60;font-size:14px}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top g"><div class="in">
  <button class="logo" data-go="home" type="button"><img id="logoImg" alt="" hidden style="height:34px;width:auto;vertical-align:middle;margin-inline-end:8px;border-radius:6px"><span data-t="brand"></span></button>
  <nav data-ta="nav_label">
    <button type="button" data-go="home" data-t="nav_home"></button>
    <button type="button" data-go="shop" data-t="nav_shop"></button>
    <button type="button" data-go="try" data-t="nav_try"></button>
    <button type="button" data-go="albums" data-t="nav_albums"></button>
    <button type="button" data-go="tips" data-t="nav_tips"></button>
    <button type="button" data-go="how" data-t="nav_how"></button>
  </nav>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ar" lang="ar">عربي</button>
    <button type="button" data-lang="fa" lang="fa">فارسی</button>
    <button type="button" data-lang="en" lang="en">EN</button>
  </div>
  <button class="cartBtn" id="openCart" type="button"><span data-t="cart"></span> <span class="badge" id="cartCount">0</span></button>
</div></header>

<main class="g"><div class="in">

<section class="view" id="v-home">
  <div class="hero">
    <div class="txt">
      <h1><span data-t="hero_a"></span> <em data-t="hero_b"></em> <span data-t="hero_c"></span></h1>
      <p data-t="hero_p"></p>
      <div class="heroSw" id="heroSw"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" data-go="try" type="button" data-t="btn_try"></button>
        <button class="btn" data-go="shop" type="button" data-t="btn_browse"></button>
      </div>
      <span class="demo" data-t="demo"></span>
    </div>
    <canvas id="heroCv" width="700" height="457" data-ta="hero_alt"></canvas>
  </div>
  <div class="sec"><header><h2 data-t="sec_cats"></h2></header><div class="cats" id="cats"></div></div>
  <div class="sec"><header><h2 data-t="sec_albums"></h2><button class="btn sm" data-go="albums" type="button" data-t="all_albums"></button></header><div class="albums" id="homeAlbums"></div></div>
  <div class="sec"><header><h2 data-t="sec_why"></h2></header>
    <div class="why">
      <div><b data-t="why1t"></b><p data-t="why1p"></p></div>
      <div><b data-t="why2t"></b><p data-t="why2p"></p></div>
      <div><b data-t="why3t"></b><p data-t="why3p"></p></div>
      <div><b data-t="why4t"></b><p data-t="why4p"></p></div>
    </div>
  </div>
</section>

<section class="view" id="v-shop" hidden>
  <div class="shop">
    <aside class="filters" id="filters"></aside>
    <div>
      <div class="shopTop">
        <input id="q" type="search" data-tp="search_ph">
        <select id="sort" data-ta="sort"><option value="new" data-t="sort_new"></option><option value="low" data-t="sort_low"></option><option value="high" data-t="sort_high"></option></select>
        <span class="muted" id="count"></span>
      </div>
      <div class="prods" id="prods"></div>
    </div>
  </div>
</section>

<section class="view" id="v-try" hidden>
  <div class="tool">
    <div class="stage">
      <div class="bar">
        <button class="btn primary" id="upload" type="button" data-t="upload"></button>
        <input id="file" type="file" accept="image/*" hidden>
        <button class="btn" id="sample" type="button" data-t="sample"></button>
      </div>
      <div class="cbox"><canvas id="view" width="1000" height="680" data-ta="view_alt"></canvas></div>
      <p class="note" id="hint"></p>
      <div class="bar">
        <div class="seg" role="group">
          <button type="button" id="m-corners" aria-pressed="true" data-t="m_corners"></button>
          <button type="button" id="m-brush" aria-pressed="false" data-t="m_brush"></button>
          <button type="button" id="m-erase" aria-pressed="false" data-t="m_erase"></button>
        </div>
        <label class="ctl" id="brushCtl" for="brush" hidden><span data-t="brush"></span> <input type="range" id="brush" min="6" max="80" value="28"></label>
        <label class="ctl" for="scale"><span data-t="scale"></span> <input type="range" id="scale" min="2" max="14" step="0.5" value="5"></label>
        <label class="ctl" for="split"><span data-t="split"></span> <input type="range" id="split" min="0" max="100" value="100"></label>
      </div>
      <div class="bar"><button class="btn" id="snap" type="button" data-t="snap"></button><span class="note" data-t="snap_note"></span></div>
      <div class="shots" id="shots"></div>
      <p class="note" data-t="brush_note"></p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel">
        <h3 data-t="pick"></h3>
        <div class="mini" id="mini"></div>
        <div class="cur"><span><b id="tName"></b> · <span class="code" id="tCode"></span></span><span class="price" id="tPrice"></span></div>
      </div>
      <div class="panel">
        <h3 data-t="wall_size"></h3>
        <div class="fields">
          <label class="f" for="w"><span data-t="width"></span><input id="w" type="number" min="0.5" step="0.1" value="4.2" inputmode="decimal"></label>
          <label class="f" for="h"><span data-t="height"></span><input id="h" type="number" min="0.5" step="0.1" value="2.8" inputmode="decimal"></label>
        </div>
        <div class="stats">
          <div class="stat"><small id="qLabel"></small><strong id="qty">–</strong></div>
          <div class="stat"><small data-t="approx_price"></small><strong id="tot">–</strong></div>
        </div>
        <p class="note" id="calcNote"></p>
        <button class="btn primary" id="tryAdd" type="button" data-t="add_size"></button>
      </div>
    </div>
  </div>

const F={cat:new Set(),design:new Set(),color:new Set(),style:new Set(),room:new Set(),album:new Set()};
function resetFilters(){Object.values(F).forEach(s=>s.clear());$('q').value='';}
const uq=a=>[...new Set(a)];
const groups=[['cat','f_cat',()=>CATS],['design','f_design',()=>uq(items.map(i=>i.design))],['color','f_color',()=>uq(items.flatMap(i=>i.colors||[i.color]))],['style','f_style',()=>uq(items.map(i=>i.style).filter(Boolean))],['room','f_room',()=>uq(items.flatMap(i=>i.rooms))],['album','f_album',()=>ALB]];
function renderFilters(){const box=$('filters');box.innerHTML='';const h=el('b','',t('filters'));h.style.cssText='font-family:var(--display);font-size:18px';box.append(h);
  groups.forEach(([key,label,opts],gi)=>{const d=el('details');d.open=gi<3||F[key].size>0;d.append(el('summary','',t(label)));const o=el('div','opts');
    opts().forEach(v=>{const b=btn('chip','');b.setAttribute('aria-pressed',F[key].has(v));if(key==='color'){const dot=el('span','dot');dot.style.background=COLORHEX[v];b.append(dot);}b.append(lab(v));
      b.onclick=()=>{F[key].has(v)?F[key].delete(v):F[key].add(v);b.setAttribute('aria-pressed',F[key].has(v));renderShop();};o.append(b);});d.append(o);box.append(d);});
  box.append(btn('btn sm',t('clear'),()=>{resetFilters();renderFilters();renderShop();}));}
function renderShop(){const q=$('q').value.trim().toLowerCase();let list=items.filter(i=>(!F.cat.size||F.cat.has(i.cat))&&(!F.design.size||F.design.has(i.design))&&(!F.color.size||(i.colors||[i.color]).some(c=>F.color.has(c)))&&(!F.style.size||F.style.has(i.style))&&(!F.room.size||i.rooms.some(r=>F.room.has(r)))&&(!F.album.size||F.album.has(i.album))&&(!q||i.name.some(n=>n.toLowerCase().includes(q))||i.code.toLowerCase().includes(q)));
  const s=$('sort').value;if(s==='low')list.sort((a,b)=>a.price-b.price);else if(s==='high')list.sort((a,b)=>b.price-a.price);
  $('count').textContent=t('products',num(list.length));const box=$('prods');box.innerHTML='';
  if(!list.length){box.append(el('div','empty',t('no_results')));return;}
  list.forEach(it=>{const c=el('article','card');const im=btn('img','',()=>openPD(it));im.setAttribute('aria-label',nm(it));im.append(thumb(it,240));im.style.position='relative';const sb=thumb(it,64,true);sb.style.cssText='position:absolute;inset-inline-end:8px;bottom:8px;width:64px;height:64px;border-radius:8px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);aspect-ratio:auto';im.append(sb);
    const b=el('div','b');const meta=el('span','meta',lab(it.cat)+' · ');meta.append(el('span','code',it.code));b.append(el('h3','',nm(it)),meta,el('span','price',priceLabel(it)));
    const a=el('div','acts');if(it.tryable)a.append(btn('btn sm',t('try_btn'),()=>{selectTry(it);go('try');}));a.append(btn('btn sm primary',t('details'),()=>openPD(it)));b.append(a);c.append(im,b);box.append(c);});}
$('q').oninput=renderShop;$('sort').onchange=renderShop;

let pdItem=null;
function openPD(it){pdItem=it;const pd=$('pd');pd.hidden=false;pd.innerHTML='';const d=el('div','dlg');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  const x=btn('x','×',()=>{pd.hidden=true;pdItem=null;});x.setAttribute('aria-label',t('close'));
  const left=el('div');left.style.cssText='display:flex;flex-direction:column;gap:8px';const cap=(x)=>{const p=el('p','meta',x);return p;};left.append(thumb(it,520),cap(lang==='en'?'In a room':lang==='fa'?'نمای اتاق':'في الغرفة'),thumb(it,520,true),cap(lang==='en'?'Pattern close-up':lang==='fa'?'نمای نزدیک طرح':'النقشة عن قرب'));const b=el('div','b');
  b.append(el('span','code',it.code),el('h2','',nm(it)));const pr=el('span','price',priceLabel(it));pr.style.fontSize='20px';b.append(pr);
  const dl=el('dl','attrs');const row=(k,v)=>{dl.append(el('dt','',t(k)),el('dd','',v));};
  row('a_cat',lab(it.cat));row('a_design',lab(it.design));row('a_color',(it.colors||[it.color]).map(lab).join(lang==='en'?', ':'، '));if(it.style)row('a_style',lab(it.style));if(it.rooms.length)row('a_room',it.rooms.map(lab).join(lang==='en'?', ':'، '));if(it.album)row('a_album',lab(it.album));
  row('a_sale',t(it.unit==='roll'?'unit_roll':it.unit==='m2'?'unit_m2':'unit_pc'));b.append(dl);
  const f=el('div','fields');
  if(it.unit==='pc')f.innerHTML=`<label class="f" for="pdQ">${t('count')}<input id="pdQ" type="number" min="1" value="1"></label>`;
  else f.innerHTML=`<label class="f" for="pdW">${t('wall_w')}<input id="pdW" type="number" step="0.1" min="0.5" value="${$('w').value}"></label><label class="f" for="pdH">${t('wall_h')}<input id="pdH" type="number" step="0.1" min="0.5" value="${$('h').value}"></label>`;
  const out=el('p','muted');const get=()=>quote(it,+(f.querySelector('#pdW')?.value||0),+(f.querySelector('#pdH')?.value||0),+(f.querySelector('#pdQ')?.value||1));
  const upd=()=>out.textContent=get().text;f.oninput=upd;b.append(f,out);upd();
  const acts=el('div','bar');acts.append(btn('btn primary',t('add_cart'),()=>{const r=get();if(!r.qty)return;addToCart(it,r);pd.hidden=true;pdItem=null;}));
  if(it.tryable)acts.append(btn('btn',t('try_btn'),()=>{pd.hidden=true;pdItem=null;selectTry(it);go('try');}));
  b.append(acts);d.append(x,left,b);pd.append(d);x.focus();}
$('pd').addEventListener('click',e=>{if(e.target.id==='pd'){$('pd').hidden=true;pdItem=null;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('pd').hidden=true;pdItem=null;closeCart();}});

/* ================= quote ================= */
function quote(it,w,h,q){
  if(it.unit==='pc'){const n=Math.max(1,Math.round(q||1));return{qty:n,total:n*it.price,size:'',text:t('q_pc',num(n))+' · '+fmt(n*it.price)};}
  if(!(w>0&&h>0))return{qty:0,total:0,text:t('enter_size')};
  if(it.unit==='m2'){const a=Math.round(w*h*100)/100;return{qty:a,total:a*it.price,size:`${w}×${h} m`,text:t('q_m2',num(a))+' · '+fmt(a*it.price)};}
  const strips=Math.ceil(w/0.53),per=Math.max(1,Math.floor(10/(h+0.1))),n=Math.ceil(strips/per);return{qty:n,total:n*it.price,size:`${w}×${h} m`,text:t('q_roll',num(n))+' · '+fmt(n*it.price)};}
const unitQty=c=>t(c.it.unit==='roll'?'u_roll':c.it.unit==='m2'?'u_m2':'u_pc',num(c.qty));

/* ================= cart ================= */
const cart=[];
function addToCart(it,r){const ex=cart.find(c=>c.it===it&&c.size===r.size);if(ex&&it.unit!=='m2')ex.qty+=r.qty;else cart.push({it,qty:r.qty,size:r.size});renderCart();toast(t('added',nm(it)));}
const lineTotal=c=>c.qty*c.it.price;
function renderCart(){$('cartCount').textContent=num(cart.length);const box=$('lines');box.innerHTML='';
  if(!cart.length)box.append(el('p','muted',t('cart_empty')));
  cart.forEach((c,i)=>{const l=el('div','line');l.append(thumb(c.it,112,true));const m=el('div');m.append(el('b','',nm(c.it)));const mt=el('div','meta');mt.append(el('span','code',c.it.code));if(c.size)mt.append(' · '+c.size);m.append(mt,el('div','price',fmt(lineTotal(c))));
    const q=el('div','qty');
    if(c.it.unit==='m2')q.append(el('span','meta',t('u_m2',num(c.qty))));
    else{const pl=btn('','+',()=>{c.qty++;renderCart();});pl.setAttribute('aria-label',t('more'));const s=el('span','',num(c.qty));s.style.cssText='min-width:20px;text-align:center';const mi=btn('','−',()=>{c.qty--;if(c.qty<1)cart.splice(i,1);renderCart();});mi.setAttribute('aria-label',t('less'));q.append(pl,s,mi);}
    const rm=btn('','×',()=>{cart.splice(i,1);renderCart();});rm.setAttribute('aria-label',t('del'));q.append(rm);l.append(m,q);box.append(l);});
  $('sum').textContent=fmt(cart.reduce((s,c)=>s+lineTotal(c),0));$('cOut').hidden=$('cActs').hidden=true;}
function openCart(){$('drawer').hidden=false;$('cartScrim').hidden=false;}
function closeCart(){$('drawer').hidden=true;$('cartScrim').hidden=true;}
$('openCart').onclick=openCart;$('closeCart').onclick=closeCart;$('cartScrim').onclick=closeCart;
$('checkout').onclick=()=>{if(!cart.length){toast(t('empty_toast'));return;}
  const lines=cart.map(c=>`• ${nm(c.it)} (${c.it.code})${c.size?' – '+c.size:''} – ${unitQty(c)} – ${fmt(lineTotal(c))}`).join('\n');
  showMsg('cOut','cActs',`${t('msg_head')}\n${lines}\n${t('msg_total')}: ${fmt(cart.reduce((s,c)=>s+lineTotal(c),0))}\n${t('msg_name')}: ${$('cName').value||'-'}\n${t('msg_area')}: ${$('cArea').value||'-'}`);};

function showMsg(outId,actsId,txt){const o=$(outId),a=$(actsId);o.textContent=txt;o.hidden=false;a.hidden=false;a.innerHTML='';
  const l=el('a','btn primary sm',t('open_wa'));l.href='https://wa.me/'+(CFG.wa||'')+'?text='+encodeURIComponent(txt);l.target='_blank';l.rel='noopener';a.append(l,btn('btn sm',t('copy_msg'),()=>copyText(txt,o)));}
function copyText(txt,o){const sel=()=>{const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(t('select_manual'));};try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),sel);}catch(_){sel();}}
function shareMsg(txt){go('how');$('iText').value=txt;showMsg('iOut','iActs',txt);}

function tri(c,img,s0,s1,s2,d0,d1,d2){
